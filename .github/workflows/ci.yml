name: Verify Discord Digest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/discord-digest .
      - run: docker build -t projectpm25-discord-digest:ci .
