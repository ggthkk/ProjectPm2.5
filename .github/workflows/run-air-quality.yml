name: Preview Discord Digest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Preview only - scheduled delivery runs in Portainer
        run: go run . -mode=once -dry-run
        env:
          API_KEY: ${{ secrets.API_KEY }}
          MAP: ${{ vars.MAP }}
