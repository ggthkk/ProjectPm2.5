name: Send Discord Report
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-discord-report
  cancel-in-progress: false
jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Send latest report to Discord
        run: |
          test -n "$API_KEY" || { echo "Missing repository secret API_KEY"; exit 1; }
          test -n "$DISCORD_WEBHOOK_URL" || { echo "Missing repository secret DISCORD_WEBHOOK_URL"; exit 1; }
          test -n "$MAP" || { echo "Missing repository variable MAP"; exit 1; }
          go run . -mode=once
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAP: ${{ vars.MAP }}
          WATER_RADIUS_KM: ${{ vars.WATER_RADIUS_KM || '10' }}
          WATER_PROVINCES: ${{ vars.WATER_PROVINCES || '10,12,13' }}
          ALERT_AREAS: ${{ vars.ALERT_AREAS || 'กรุงเทพ,นนทบุรี,ปทุมธานี,Bangkok,Nonthaburi,Pathum Thani' }}
          TZ: Asia/Bangkok
          DATA_DIR: ${{ runner.temp }}/discord-report-${{ github.run_id }}-${{ github.run_attempt }}
          # Explicit manual send works at any hour; VPS quiet hours are unchanged.
          QUIET_START: '0'
          QUIET_END: '0'
